<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- === PWA / Web App iOS === -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lirion">
  <meta name="theme-color" content="#facc15">
  <link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
  <link rel="manifest" href="../manifest.json">
  <!-- === /PWA === -->
  <title>Lirion — Graphogame · Prérequis</title>
  <link rel="stylesheet" href="../components/main.css">
  <style>
    .game-canvas {
      background: var(--training-graphogame-200);
    }

    /* ── Pause button ──────────────────────────────────────────── */
    .screen-header .btn--icon {
      background: var(--training-graphogame-200);
      border: solid 2px var(--training-graphogame-300);
      color: oklch(1 0 0);
    }
    .screen-header .btn--icon:hover {
      background: color-mix(in oklab, var(--training-graphogame-200) 85%, black);
    }

    /* ── Header title ──────────────────────────────────────────── */
    .graphogame__title {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
      color: oklch(1 0 0);
    }

    /* ── Panes ─────────────────────────────────────────────────── */
    .prereq__pane--lion {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .prereq__pane--form {
      flex: 2;
    }

    /* ── Lion ──────────────────────────────────────────────────── */
    .prereq__lion {
      position: absolute;
      bottom: -15%;
      left: 50%;
      transform: translateX(-50%);
      height: 95%;
      width: auto;
    }

    /* ── Card ──────────────────────────────────────────────────── */
    .prereq__card {
      width: 100%;
      max-width: 24rem;
    }

    .card__title {
      font-size: var(--text-xl);
    }

    /* ── Stat items ────────────────────────────────────────────── */
    .prereq__stat-single {
      display: flex;
      justify-content: center;
    }

    .stats-row {
      display: flex;
      flex-direction: row;
      gap: var(--space-4);
      align-items: flex-start;
      justify-content: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
    }

    .stat-circle {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: var(--radius-full);
      background: var(--training-graphogame-300);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-circle__value {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: oklch(1 0 0);
    }

    .stat-label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--foreground);
      text-align: center;
      white-space: nowrap;
    }

    /* ── Floating audio button ─────────────────────────────────── */
    .btn-audio {
      position: absolute;
      bottom: var(--space-4);
      right: var(--space-4);
      width: 3.5rem;
      height: 3.5rem;
      background: var(--training-graphogame-300);
      border: none;
      color: oklch(1 0 0);
      z-index: 10;
    }
    .btn-audio:hover {
      background: color-mix(in oklab, var(--training-graphogame-300) 85%, black);
    }

    .audio-bars {
      width: 1.25em;
      height: 1.25em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Dialog — pause -->
  <div class="dialog-overlay" id="pause-overlay">
    <button class="btn btn--icon btn--primary dialog__close" id="btn-pause-close" aria-label="Reprendre">
      <i data-lucide="x" class="text-xl"></i>
    </button>
    <div class="dialog-wrapper">
      <div class="dialog-lion">
        <img src="../assets/illustration/thinking.png" class="dialog-lion__img" alt="">
      </div>
      <div class="dialog-pane">
        <div class="dialog">
          <div class="dialog__content">
            <h2 class="dialog__title">Ton entraînement est en pause.</h2>
          </div>
          <div class="dialog__footer">
            <button class="btn btn--default btn--lg btn--full" id="btn-pause-resume">
              <i data-lucide="play"></i>
              Reprendre
            </button>
            <button class="btn btn--outline btn--lg btn--full" id="btn-pause-quit">
              Quitter
            </button>
            <p class="dialog__text text-center">Tu devras recommencer à zéro.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="game-viewport">
    <div class="game-canvas">
      <div class="screen screen-layout">

        <header class="screen-header">
          <div class="bar-start">
            <button class="btn btn--icon btn--primary" id="btn-pause" aria-label="Pause">
              <i data-lucide="pause" fill="#fff" class="text-2xl"></i>
            </button>
            <span class="graphogame__title">Graphogame</span>
          </div>
        </header>

        <main class="screen-body screen-body--split">

          <div class="screen-pane prereq__pane--lion">
            <img src="../assets/illustration/hello.png" class="prereq__lion" alt="">
          </div>

          <div class="screen-pane prereq__pane--form">
            <div class="card prereq__card">

              <div class="card__header">
                <h2 class="card__title text-center">Associer les sons aux lettres</h2>
              </div>

              <div class="card__content">

                <!-- Stat centré — Parent + Enfant -->
                <div class="prereq__stat-single">
                  <div class="stat-item">
                    <div class="stat-circle">
                      <i data-lucide="users" class="text-2xl" style="color: oklch(1 0 0);"></i>
                    </div>
                    <span class="stat-label">Parent + Enfant</span>
                  </div>
                </div>

                <!-- 3 stats en row -->
                <div class="stats-row">

                  <div class="stat-item">
                    <div class="stat-circle">
                      <i data-lucide="headphones" class="text-2xl" style="color: oklch(1 0 0);"></i>
                    </div>
                    <span class="stat-label">Casque</span>
                  </div>

                  <div class="stat-item">
                    <div class="stat-circle">
                      <i data-lucide="tablet-smartphone" class="text-2xl" style="color: oklch(1 0 0);"></i>
                    </div>
                    <span class="stat-label">App Graphogame</span>
                  </div>

                  <div class="stat-item">
                    <div class="stat-circle">
                      <span class="stat-circle__value">15</span>
                    </div>
                    <span class="stat-label">Minutes</span>
                  </div>

                </div>

              </div>

              <div class="card__footer">
                <button class="btn btn--default btn--lg btn--full" id="btn-continue">
                  Continuer
                </button>
              </div>

            </div>
          </div>

        </main>

        <!-- Bouton audio flottant -->
        <button class="btn btn--icon btn-audio" aria-label="Écouter les instructions">
          <svg class="audio-bars" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect class="bar" x="2"    y="0" width="2.5" height="24" rx="1.25"/>
            <rect class="bar" x="7.5"  y="0" width="2.5" height="24" rx="1.25"/>
            <rect class="bar" x="13"   y="0" width="2.5" height="24" rx="1.25"/>
            <rect class="bar" x="18.5" y="0" width="2.5" height="24" rx="1.25"/>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="../components/main.js"></script>
  <script>
    lucide.createIcons();

    // ── Pause overlay ──────────────────────────────────────────────
    const pauseOverlay  = document.getElementById('pause-overlay');
    const btnPause      = document.getElementById('btn-pause');
    const btnPauseClose = document.getElementById('btn-pause-close');
    const btnResume     = document.getElementById('btn-pause-resume');
    const btnQuit       = document.getElementById('btn-pause-quit');

    function openPause()  { pauseOverlay.classList.add('dialog-overlay--open'); }
    function closePause() { pauseOverlay.classList.remove('dialog-overlay--open'); }

    btnPause.addEventListener('click', openPause);
    btnPauseClose.addEventListener('click', closePause);
    btnResume.addEventListener('click', closePause);
    btnQuit.addEventListener('click', () => { window.location.href = '../home.html'; });
    pauseOverlay.addEventListener('click', e => { if (e.target === pauseOverlay) closePause(); });

    // ── Navigation ─────────────────────────────────────────────────
    document.getElementById('btn-continue').addEventListener('click', () => {
      window.location.href = 'graphogame-access.html';
    });
  </script>
</body>
</html>
